<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Studio — Aether</title>
  <meta name="description" content="Guided Studio for professional AI web development. Lock project intent and one clear aesthetic direction before any generation begins.">
  <meta name="color-scheme" content="light dark">
  <link rel="stylesheet" href="css/base.css">
  <style>
    .studio-wrap { max-width: 40rem; margin-inline: auto; padding: var(--space-10) var(--gutter); }
    .field { display: grid; gap: var(--space-2); margin-bottom: var(--space-5); }
    .field label { font-weight: 600; font-size: var(--text-sm); }
    .field .hint { font-size: var(--text-xs); color: var(--color-text-muted); }
    .field input, .field textarea, .field select {
      width: 100%; min-height: 2.75rem; padding: 0.6rem 0.85rem;
      border: 1px solid var(--color-border-strong); border-radius: var(--radius-md);
      background: var(--color-bg); color: var(--color-text);
    }
    .field textarea { min-height: 5rem; resize: vertical; }
    .field input:invalid:not(:placeholder-shown),
    .field textarea:invalid:not(:placeholder-shown),
    .field select:invalid:not(:focus) { border-color: var(--color-danger); }
    .nav { display: flex; align-items: center; justify-content: space-between; padding-block: var(--space-4); }
    .logo { font-family: var(--font-serif); font-weight: 600; font-size: var(--text-lg); color: var(--color-text); text-decoration: none; }
    .logo span { color: var(--color-accent-text); }
    .btn[aria-busy="true"] { opacity: 0.7; cursor: wait; }
    .status-region { margin-top: var(--space-8); min-height: 3rem; }
  </style>
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  <header>
    <div class="container">
      <nav class="nav" aria-label="Primary">
        <a href="index.html" class="logo">Aether<span>.</span></a>
        <a href="index.html" class="btn btn-ghost">← Home</a>
      </nav>
    </div>
  </header>
  <main id="main" class="studio-wrap">
    <p class="text-accent" style="font-size: var(--text-xs); font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: var(--space-3);">Step 1 · Intent</p>
    <h1 class="heading heading-sm" style="margin-bottom: var(--space-3);">Lock intent &amp; aesthetic</h1>
    <p class="text-muted" style="margin-bottom: var(--space-8);">No generation until these are clear. Ambiguous prompts produce median (slop) output.</p>

    <form id="intent-form" novalidate>
      <div class="field">
        <label for="project-name">Project name</label>
        <input type="text" id="project-name" name="project-name" required placeholder="e.g. Northwind Analytics" autocomplete="off">
      </div>
      <div class="field">
        <label for="purpose">Primary purpose</label>
        <p class="hint">One clear sentence.</p>
        <textarea id="purpose" name="purpose" required placeholder="Help consultants book discovery calls in under 60 seconds."></textarea>
      </div>
      <div class="field">
        <label for="audience">Primary audience</label>
        <input type="text" id="audience" name="audience" required placeholder="Independent consultants, 30–50">
      </div>
      <div class="field">
        <label for="aesthetic">Aesthetic direction (anti-slop lock)</label>
        <p class="hint">“Clean and modern” is not allowed. Aether itself uses Restrained Editorial.</p>
        <select id="aesthetic" name="aesthetic" required>
          <option value="">Choose a direction…</option>
          <option value="restrained-editorial">Restrained Editorial</option>
          <option value="utilitarian">Utilitarian product</option>
          <option value="warm-craft">Warm craft</option>
          <option value="brutal">Brutal / direct</option>
          <option value="institutional">Institutional trust</option>
        </select>
      </div>
      <div class="cluster" style="margin-top: var(--space-6);">
        <button type="submit" class="btn btn-primary" id="submit-btn">Lock intent</button>
        <a href="standards.html" class="btn btn-secondary">Standards</a>
      </div>
    </form>

    <div id="status" class="status-region" role="status" aria-live="polite"></div>
  </main>
  <script>
    (function () {
      const form = document.getElementById('intent-form');
      const status = document.getElementById('status');
      const btn = document.getElementById('submit-btn');

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        status.innerHTML = '';
        status.className = 'status-region';

        // Basic validation
        const data = Object.fromEntries(new FormData(form));
        const missing = Object.entries(data).filter(function (pair) { return !String(pair[1]).trim(); });
        if (missing.length) {
          status.className = 'status-region form-status error';
          status.textContent = 'Please complete every field. Intent and aesthetic must be locked before generation.';
          return;
        }

        // Loading state
        btn.setAttribute('aria-busy', 'true');
        btn.disabled = true;
        status.className = 'status-region form-status';
        status.textContent = 'Locking intent…';

        // Simulate brief processing then success
        setTimeout(function () {
          btn.removeAttribute('aria-busy');
          btn.disabled = false;
          status.className = 'status-region form-status success';
          status.innerHTML = '<strong>Intent locked</strong> for “' + data['project-name'] + '” with <em>' + data.aesthetic + '</em> direction. All subsequent generation must stay inside this system and the Master Checklist. No purple, no glass, no neon.';
          try { localStorage.setItem('aether-intent', JSON.stringify(data)); } catch (err) {}
        }, 600);
      });
    })();
  </script>
</body>
</html>
